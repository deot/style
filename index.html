<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<title>@deot/style 文档</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta charset="UTF-8">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-client/dist/index.style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-renderer/dist/index.style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-markdown/dist/index.style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-playground/dist/index.style.css">
</head>
<body>
	<div id="app"></div>
	<script>
		const repositoryRaw = 'https://raw.githubusercontent.com/deot/style/refs/heads/main/';
		const repositoryBlob = 'https://github.com/deot/style/blob/main/';
		const locales = {
			'zh-CN': { label: '简体中文' },
			'en-US': { label: 'English' }
		};
		const documents = [
			{ label: { zh: '仓库概览', en: 'Overview' }, value: 'introduction', source: 'README.md' },
			{ label: { zh: '选择与安装', en: 'Choose and Install' }, value: 'getting-started', source: 'docs/getting-started.md' },
			{ label: { zh: '接入与迁移', en: 'Integration and Migration' }, value: 'integration', source: 'docs/integration.md' },
			{ label: { zh: '@deot/style-unocss', en: '@deot/style-unocss' }, value: 'unocss', source: 'packages/unocss/README.md' },
			{ label: { zh: '@deot/style Sass', en: '@deot/style Sass' }, value: 'sass', source: 'packages/index/README.md' },
			{ label: { zh: 'Sass/CSS 示例', en: 'Sass/CSS Playground' }, value: 'playground', source: 'docs/playground.md' },
			{ label: { zh: '工具类参考', en: 'Utilities' }, value: 'utilities', source: 'docs/DOCUMENT.md' }
		];
		const readmes = Object.fromEntries(documents.map(item => [item.value, item.source]));
		const readmeRoutes = Object.fromEntries(documents.map(item => [
			item.source,
			`/guide/${item.value}`
		]));
		const localeReadmes = Object.fromEntries(Object.keys(locales).map(lang => [lang, readmes]));
		const documentItem = (value, lang) => {
			const item = documents.find(document => document.value === value);
			return {
				label: lang === 'zh-CN' ? item.label.zh : item.label.en,
				value: `/guide/${value}`
			};
		};
		const sidebars = Object.fromEntries(Object.keys(locales).map(lang => [
			lang,
			[
				documentItem('introduction', lang),
				{
					label: lang === 'zh-CN' ? '开始使用' : 'Start',
					children: [
						documentItem('getting-started', lang),
						documentItem('integration', lang)
					]
				},
				{
					label: lang === 'zh-CN' ? '包与配置' : 'Packages and Configuration',
					children: [
						documentItem('unocss', lang),
						documentItem('sass', lang)
					]
				},
				{
					label: lang === 'zh-CN' ? '参考与示例' : 'Reference and Examples',
					children: [
						documentItem('utilities', lang),
						documentItem('playground', lang)
					]
				}
			]
		]));

		const createHomeDocument = (lang) => {
			const t = (zh, en) => (lang === 'zh-CN' ? zh : en);
			const accent = '#be185d';
			const accentSecondary = '#0f766e';
			const accents = [accent, accentSecondary, '#d97706'];
			const action = (label, to, variant = 'solid') => ({
				label,
				to: `/${lang}${to}`,
				variant,
				size: 'large',
				color: accent,
				textColor: variant === 'solid' ? '#ffffff' : accent
			});
			const stack = {
				marginTop: 0,
				marginBottom: 80,
				paddingTop: 0,
				paddingBottom: 0,
				maxWidth: 1200
			};
			const block = (id, type, props, appearance = stack) => ({
				id,
				module: { type, version: 1, props },
				appearance
			});
			const cards = items => items.map((item, index) => ({
				...item,
				accent: item.accent || accents[index]
			}));

			return {
				schemaVersion: 2,
				meta: { id: `style-home-${lang}`, title: '@deot/style' },
				layout: {
					mode: 'sortable',
					maxWidth: 1920,
					minHeight: 600,
					background: '#ffffff'
				},
				blocks: [
					block('home-hero', 'hero', {
						eyebrow: '@deot/style workspace',
						title: t('一套工具类，两种交付方式', 'One utility system, two delivery modes'),
						description: t(
							'使用 @deot/style 交付预编译 CSS 与可配置 Sass，或使用 @deot/style-unocss 按需生成同一套 g-* 语义。',
							'Use @deot/style for prebuilt CSS and configurable Sass, or @deot/style-unocss to generate the same g-* semantics on demand.'
						),
						align: 'left',
						accent,
						accentSecondary,
						background: '',
						showVisual: true,
						minHeight: 500,
						highlights: [
							{ value: '2', label: t('独立发布包', 'Published packages') },
							{ value: 'g-*', label: t('共享工具类语义', 'Shared utility semantics') },
							{ value: 'Sass / UnoCSS', label: t('静态与按需', 'Static and on-demand') }
						],
						actions: [
							action(t('选择接入方式', 'Choose an Integration'), '/guide/getting-started'),
							action(t('查看 UnoCSS Preset', 'Open UnoCSS Preset'), '/guide/unocss', 'outline')
						]
					}, { ...stack, marginBottom: 64, fullWidth: true }),
					block('home-features', 'features', {
						eyebrow: t('选择交付方式', 'Delivery modes'),
						title: t('按项目构建方式接入', 'Integrate for the way your project builds'),
						description: t(
							'两个包共享核心工具类，但配置时机、scale 语义和输出方式不同。',
							'The packages share core utilities while differing in configuration timing, scale semantics and output.'
						),
						columns: 3,
						gap: 24,
						items: cards([
							{
								title: '@deot/style',
								description: t('直接引入 px、rem、rpx、normalize 产物，或由 Sass 源码生成项目样式。', 'Import px, rem, rpx and normalize outputs, or generate project CSS from Sass source.'),
								badge: 'CSS / Sass',
								icon: 'grid'
							},
							{
								title: '@deot/style-unocss',
								description: t('组合 presetMini 与 @deot/style 兼容规则，只生成源码实际使用的 token。', 'Combine presetMini with @deot/style-compatible rules and generate only tokens found in source.'),
								badge: 'UnoCSS',
								icon: 'filter'
							},
							{
								title: t('共享 g-* 语义', 'Shared g-* semantics'),
								description: t('布局、间距、颜色、排版与辅助类可以在迁移时保持主要类名。', 'Keep core layout, spacing, color, typography and helper class names while migrating.'),
								badge: 'Utilities',
								icon: 'link'
							}
						])
					}),
					block('home-steps', 'steps', {
						eyebrow: t('接入路径', 'Integration path'),
						title: t('先选择，再配置，最后验证', 'Choose, configure, then verify'),
						columns: 3,
						items: cards([
							{ title: t('选择', 'Choose'), description: t('预编译 CSS、可配置 Sass 或 UnoCSS 按需生成。', 'Pick prebuilt CSS, configurable Sass or on-demand UnoCSS.'), icon: '01' },
							{ title: t('配置', 'Configure'), description: t('确定 prefix、unit、scale、主题与构建目标。', 'Set prefix, unit, scale, theme and build target.'), icon: '02' },
							{ title: t('验证', 'Verify'), description: t('检查静态 token、动态 safelist，并避免重复引入完整样式。', 'Check static tokens and dynamic safelists, and avoid duplicate full style sources.'), icon: '03' }
						])
					}),
					block('home-cta', 'cta', {
						eyebrow: t('接入指南', 'Integration guide'),
						title: t('按目标环境完成配置', 'Configure for each target environment'),
						description: t('查看 Web、REM、RPX、UnoCSS 与多入口开发场景的边界和迁移建议。', 'Review boundaries and migration guidance for Web, REM, RPX, UnoCSS and multi-entry development.'),
						align: 'center',
						accent,
						accentSecondary,
						background: '',
						actions: [action(t('查看接入与迁移', 'Open Integration Guide'), '/guide/integration')]
					}, { ...stack, marginBottom: 0, fullWidth: true })
				]
			};
		};

		const pathSegments = location.pathname.split('/');
		const localeIndex = pathSegments.findIndex(segment => Boolean(locales[segment]));
		const basePath = localeIndex >= 0
			? `${pathSegments.slice(0, localeIndex).join('/')}/`
			: location.pathname.endsWith('/')
				? location.pathname
				: new URL('./', location.href).pathname;

		window.$docs = {
			base: new URL(basePath, location.origin).href,
			namespace: '@deot/style-site',
			repository: 'https://github.com/deot/style',
			theme: { default: 'system' },
			locales,
			routes: Object.fromEntries([
				['/', {
					content: {
						'zh-CN': createHomeDocument('zh-CN'),
						'en-US': createHomeDocument('en-US')
					}
				}],
				...documents.map(item => [`/guide/${item.value}`, {
					value: item.value,
					content: 'default',
					sidebar: sidebars,
					header: 'default',
					footer: 'default',
					extra: null
				}]),
				['*', '/guide/getting-started']
			]),
			resolve: {
				markdown: ({ lang, value }) => (
					localeReadmes[lang] || localeReadmes['zh-CN']
				)[value],
				resource: ({ source, runtime }) => {
					if (source === 'README.md' || /^(docs\/[^/]+\.md|packages\/[^/]+\/README\.md)$/.test(source)) {
						return runtime.mode === 'development'
							? `/${source}`
							: new URL(source, repositoryRaw).href;
					}
					return undefined;
				},
				link: ({ href, lang, source }) => {
					const logicalOrigin = 'https://docs.local';
					let target;
					try {
						target = new URL(href, new URL(source, `${logicalOrigin}/`));
					} catch {
						return undefined;
					}
					if (target.origin !== logicalOrigin) return undefined;
					const path = target.pathname.replace(/^\//, '');
					const route = readmeRoutes[path];
					if (route) return `/${lang}${route}${target.search}${target.hash}`;
					return `${new URL(path, repositoryBlob).href}${target.search}${target.hash}`;
				}
			},
			modules: {
				'@deot/style': 'https://cdn.jsdelivr.net/npm/@deot/style@1.1.4/dist/index.js',
				'@deot/style/dist': 'https://cdn.jsdelivr.net/npm/@deot/style@1.1.4/dist/index.js'
			},
			styles: {
				'@deot/style/dist/index.normalize-only.css': 'https://cdn.jsdelivr.net/npm/@deot/style@1.1.4/dist/index.normalize-only.css',
				'@deot/style/dist/index.css': 'https://cdn.jsdelivr.net/npm/@deot/style@1.1.4/dist/index.css'
			}
		};
	</script>
	<script type="module" src="https://cdn.jsdelivr.net/npm/@deot/docs-client/+esm"></script>
</body>
</html>
